{% set active = 'feed' %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ power_component.title }} — PC Power Calc</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <a class="header__logo" href="/power_components">PC Power Calc</a>
    </header>

    <main class="page page--feed">
        <div class="feed">
            <video class="feed__video"
                   poster="{{ power_component.image_url or '/static/img/default-component.png' }}"
                   autoplay muted loop playsinline>
                {% if power_component.video_url %}
                <source src="{{ power_component.video_url }}" type="video/mp4">
                {% endif %}
                <source src="/static/video/default-component.mp4" type="video/mp4">
            </video>

            <aside class="feed__side">
                <div class="feed__param">
                    <span class="feed__icon">⚡</span>
                    <span class="feed__value">{{ power_component.power_watt }} Вт</span>
                </div>
                <div class="feed__param">
                    <span class="feed__icon">⚖</span>
                    <span class="feed__value">{{ power_component.weight_gram }} г</span>
                </div>
                <div class="feed__param">
                    <span class="feed__icon feed__icon--like">♥</span>
                    <span class="feed__value">{{ likes_count }}</span>
                </div>
                <a class="button feed__next" href="/power_components/feed/{{ power_component.id }}?next=true">След. →</a>
            </aside>

            <div class="feed__overlay">
                <h1 class="feed__title">{{ power_component.title }}</h1>

                <label class="feed__description">
                    <input class="feed__toggle" type="checkbox" hidden>
                    <span class="feed__text feed__text--short">
                        {{ power_component.description[:70] }}…<span class="feed__more">ещё</span>
                    </span>
                    <span class="feed__text feed__text--full">
                        {{ power_component.description }}<span class="feed__more">скрыть</span>
                    </span>
                </label>
            </div>
        </div>
    </main>

    {% include "tabbar.html" %}
</body>
</html>
