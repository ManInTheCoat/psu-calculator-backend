services:
  postgres:
    container_name: pc_power_postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pc_builder
      POSTGRES_PASSWORD: pc_builder_pass
      POSTGRES_DB: pc_power_db

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data


  adminer:
    container_name: pc_power_adminer
    image: adminer:latest

    ports:
      - "8081:8080"

    depends_on:
      - postgres


  minio:
    container_name: minio_storage
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
      MINIO_CONSOLE_ADDRESS: ":9001"

    volumes:
      - minio-data:/data

    command: server /data --console-address ":9001"


volumes:
  minio-data:
  postgres-data:
